<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Amir Ghaderian, Frontend Developer. 5+ years building fast, scalable interfaces with React and Next.js">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .dir { fill: #58a6ff; }
    .prompt { fill: #3fb950; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.5px; }
    .role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: 0.2px; }
    .glyph { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 120px; font-weight: 700; }
    .tag { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #8b949e; }
  </style>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
    <mask id="dotMask"><rect width="840" height="300" fill="url(#fadeR)"/></mask>
    <clipPath id="card"><rect width="840" height="300" rx="14"/></clipPath>
    <clipPath id="t0"><rect x="42" y="37" height="23" width="0"><animate attributeName="width" begin="0.40s" dur="0.45s" values="0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;840" calcMode="discrete" fill="freeze"/></rect></clipPath>
    <clipPath id="t1"><rect x="42" y="193" height="23" width="0"><animate attributeName="width" begin="1.90s" dur="0.77s" values="0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;99.0;108.0;117.0;126.0;135.0;144.0;153.0;840" calcMode="discrete" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="42" y="221" height="23" width="0"><animate attributeName="width" begin="2.87s" dur="1.92s" values="0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;99.0;108.0;117.0;126.0;135.0;144.0;153.0;162.0;171.0;180.0;189.0;198.0;207.0;216.0;225.0;234.0;243.0;252.0;261.0;270.0;279.0;288.0;297.0;306.0;315.0;324.0;333.0;342.0;351.0;360.0;369.0;378.0;387.0;396.0;405.0;414.0;423.0;432.0;441.0;450.0;459.0;468.0;477.0;486.0;495.0;504.0;513.0;522.0;531.0;540.0;549.0;558.0;567.0;576.0;840" calcMode="discrete" fill="freeze"/></rect></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="840" height="300" fill="#0d1117"/>
    <rect width="840" height="300" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect y="297" width="840" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="299" rx="14" fill="none" stroke="#30363d"/>

  <text x="780" y="168" text-anchor="end" class="glyph" fill="url(#accent)" opacity="0">&lt;/&gt;<animate attributeName="opacity" from="0" to="0.9" begin="1.30s" dur="0.6s" fill="freeze"/></text>

  <text x="44" y="54" class="mono" clip-path="url(#t0)" xml:space="preserve"><tspan class="dir">~ </tspan><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
  <text x="42" y="120" class="name" opacity="0">Amir Ghaderian<animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.6s" fill="freeze"/></text>
  <text x="44" y="158" class="role" fill="url(#accent)" opacity="0">Frontend Developer<animate attributeName="opacity" from="0" to="1" begin="1.20s" dur="0.6s" fill="freeze"/></text>
  <text x="44" y="210" class="mono" clip-path="url(#t1)" xml:space="preserve"><tspan class="dir">~ </tspan><tspan class="prompt">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
  <text x="44" y="238" class="mono" clip-path="url(#t2)" xml:space="preserve"><tspan class="out">5+ years building fast, scalable interfaces with React &amp; Next.js</tspan></text>
  <rect x="624.0" y="225" width="9" height="17" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" begin="4.79s" dur="1s" values="1;0" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="816" y="282" text-anchor="end" class="tag">React · Next.js · TypeScript</text>
</svg>
